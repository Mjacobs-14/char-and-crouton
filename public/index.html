<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#bd2c16">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Char &amp; Crouton">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Char &amp; Crouton</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Figtree:wght@400;500;600;700&family=Shrikhand&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-dish="burger">
  <header class="masthead">
    <div class="wrap">
      <div class="topbar">
        <span class="wordmark">Char &amp; Crouton</span>
        <button class="who" id="whoButton" type="button"></button>
      </div>
      <h1 id="boardTitle">Burgers</h1>
      <p class="stat" id="boardStat"></p>
    </div>
  </header>
  <div class="checks" aria-hidden="true"></div>

  <p class="frozen-banner" id="frozenBanner" role="status" hidden></p>
  <p class="frozen-banner" id="offlineBanner" role="status" hidden>Can't reach the server. This is the board as it was last loaded.</p>

  <main class="wrap">
    <div class="tabs" role="group" aria-label="Choose a dish">
      <button class="tab" type="button" data-dish="burger"><span aria-hidden="true">🍔</span> Burgers</button>
      <button class="tab" type="button" data-dish="caesar"><span aria-hidden="true">🥗</span> Caesars</button>
      <button class="tab" type="button" data-dish="map"><span aria-hidden="true">🗺️</span> Map</button>
      <button class="tab" type="button" data-dish="try"><span aria-hidden="true">⭐</span> <span class="long">Want to </span>Try</button>
    </div>
    <div class="controls">
      <label class="search">
        <span class="visually-hidden">Search restaurants</span>
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="m16.5 16.5 4.5 4.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="Search restaurants" autocomplete="off">
      </label>
      <button class="filter-toggle" id="filterToggle" type="button" aria-expanded="false" aria-controls="filters">Filters</button>
      <button class="primary" id="rateButton" type="button">Rate a burger</button>
    </div>
    <div class="filters" id="filters">
      <label>
        <span class="filter-label">Person</span>
        <select id="personFilter"></select>
      </label>
      <label>
        <span class="filter-label">Location</span>
        <select id="areaFilter"></select>
      </label>
      <label class="sort-filter">
        <span class="filter-label">Sort by</span>
        <select id="sort">
          <option value="top">Top rated</option>
          <option value="count">Most rated</option>
          <option value="name">A to Z</option>
        </select>
      </label>
    </div>
    <div id="board"></div>
    <div id="mapView" class="map-layout" hidden>
      <div class="explore-bar" id="exploreBar"></div>
      <div id="map" role="region" aria-label="Map of rated restaurants"></div>
      <div id="mapPanel"></div>
    </div>
  </main>

  <dialog id="rateDialog" class="sheet" aria-labelledby="rateTitle">
    <form id="rateForm" method="dialog" novalidate>
      <div class="sheet-head">
        <h2 id="rateTitle">Add a rating</h2>
        <button class="icon" type="button" data-close aria-label="Close">×</button>
      </div>

      <div class="field combo">
        <label for="restaurantInput">Restaurant</label>
        <p class="where" id="whereLine">
          <span id="whereText"></span>
          <button class="link" type="button" id="whereChange" aria-expanded="false" aria-controls="wherePanel">Change</button>
        </p>
        <div class="where-panel" id="wherePanel" hidden>
          <div class="where-choices">
            <button class="ghost" type="button" id="whereUs">Near our restaurants</button>
            <button class="ghost" type="button" id="whereMe">Near me</button>
          </div>
          <label class="visually-hidden" for="whereCity">City to search in</label>
          <input id="whereCity" type="text" maxlength="60" autocomplete="off" placeholder="Or type a city, like Chicago">
          <ul class="place-results" id="whereResults"></ul>
          <p class="where-status" id="whereStatus" role="status"></p>
        </div>
        <input id="restaurantInput" type="text" maxlength="80" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="restaurantList" aria-autocomplete="list" placeholder="Start typing a name">
        <ul id="restaurantList" class="options" role="listbox" aria-label="Matching restaurants" hidden></ul>
        <p class="picked-location" id="pickedLocation" hidden></p>
      </div>

      <div class="field" id="areaField" hidden>
        <label for="areaInput">Neighborhood or city <span class="optional">optional</span></label>
        <input id="areaInput" type="text" maxlength="60" autocomplete="off" list="areaOptions" placeholder="For example: Chicago, IL">
        <datalist id="areaOptions"></datalist>
      </div>

      <fieldset class="field" id="dishField">
        <legend>Dish</legend>
        <div class="choice">
          <label><input type="radio" name="dish" value="burger"><span>🍔 Burger</span></label>
          <label><input type="radio" name="dish" value="caesar"><span>🥗 Caesar</span></label>
        </div>
      </fieldset>

      <div class="field" id="gradeField">
        <label for="scoreInput">Your grade</label>
        <div class="score-card" id="scoreCard">
          <div class="score-dial">
            <button class="stepper" id="scoreDown" type="button" aria-label="Lower grade by 0.1">−</button>
            <input id="scoreInput" class="score-input" type="text" inputmode="decimal" maxlength="4" autocomplete="off" placeholder="?">
            <button class="stepper" id="scoreUp" type="button" aria-label="Raise grade by 0.1">+</button>
          </div>
          <div class="verdict" id="verdict"></div>
          <input id="scoreSlider" type="range" min="1" max="10" step="0.1" aria-label="Grade slider">
          <div class="scale" aria-hidden="true"><span>1.0</span><span>10.0</span></div>
        </div>
      </div>

      <div class="field">
        <label for="noteInput">Notes <span class="optional">optional</span></label>
        <textarea id="noteInput" rows="2" maxlength="280" placeholder="Crispy edges? Too much dressing?"></textarea>
      </div>

      <div class="field" id="photoField">
        <span class="field-label">Photo <span class="optional">optional</span></span>
        <div class="photo-row">
          <img id="photoPreview" class="photo-preview" alt="Your photo" hidden>
          <label class="ghost photo-pick" tabindex="0" id="photoPick">
            <span id="photoPickText">Add a photo</span>
            <input id="photoInput" class="visually-hidden" type="file" accept="image/*" tabindex="-1">
          </label>
          <button class="link" type="button" id="photoRemove" hidden>Remove</button>
        </div>
      </div>

      <p class="form-error" id="rateError" role="alert"></p>
      <p class="form-hint" id="rateHint"></p>
      <button class="primary wide" type="submit" id="rateSubmit">Post rating</button>
    </form>
  </dialog>

  <dialog id="editDialog" class="sheet narrow" aria-labelledby="editTitle">
    <form id="editForm" method="dialog" novalidate>
      <div class="sheet-head">
        <h2 id="editTitle">Edit restaurant</h2>
        <button class="icon" type="button" data-close aria-label="Close">×</button>
      </div>
      <div class="field">
        <label for="editName">Name</label>
        <input id="editName" type="text" maxlength="80" autocomplete="off">
      </div>
      <div class="field">
        <label for="editArea">Neighborhood or city <span class="optional">optional</span></label>
        <input id="editArea" type="text" maxlength="60" autocomplete="off" list="areaOptions">
      </div>
      <div class="field">
        <label for="editPlaceSearch">Find on the map</label>
        <input id="editPlaceSearch" type="search" maxlength="80" autocomplete="off" placeholder="Search a name or street address, with the city">
        <ul id="editPlaceResults" class="place-results" aria-label="Places found"></ul>
        <p class="picked-location" id="editPlaceStatus" role="status"></p>
      </div>
      <p class="form-error" id="editError" role="alert"></p>
      <button class="primary wide" type="submit" id="editSubmit">Save changes</button>
    </form>
  </dialog>

  <dialog id="authDialog" class="sheet narrow" aria-labelledby="authTitle">
    <div class="sheet-head">
      <h2 id="authTitle">Sign in</h2>
    </div>
    <form id="signInForm" novalidate>
      <div class="field">
        <label for="signInName">Your name</label>
        <input id="signInName" type="text" maxlength="30" autocomplete="username" autocapitalize="words">
      </div>
      <div class="field">
        <label for="signInPassword">Password</label>
        <input id="signInPassword" type="password" maxlength="200" autocomplete="current-password">
      </div>
      <button class="primary wide" type="submit">Sign in</button>
      <button class="link auth-switch" id="useInvite" type="button">I have an invite code</button>
    </form>
    <form id="inviteForm" novalidate hidden>
      <div class="field">
        <label for="inviteCode">Invite code</label>
        <input id="inviteCode" type="text" maxlength="20" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false">
      </div>
      <div class="field">
        <label for="invitePassword">Choose a password <span class="optional">at least 8 characters</span></label>
        <input id="invitePassword" type="password" maxlength="200" autocomplete="new-password">
      </div>
      <button class="primary wide" type="submit">Join in</button>
      <button class="link auth-switch" id="useSignIn" type="button">I already have a password</button>
    </form>
    <p class="form-error auth-error" id="authError" role="alert"></p>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
